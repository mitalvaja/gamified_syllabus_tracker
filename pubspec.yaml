name: gamified_syllabus_tracker
description: "Gamified Syllabus Tracker - Cross Platform Mobile App for GLS University"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking & HTTP
  http: ^1.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Formatting & Utilities
  intl: ^0.19.0
  
  # UI & Fonts
  google_fonts: ^6.1.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/badges/
